version: "3.9"

services:
  app:
    build: .
    container_name: zoztool-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8083}:${APP_PORT:-8083}"
    environment:
      - APP_PORT=${APP_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    volumes:
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-8083}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
